<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>I love you Basbosty</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="scene-canvas"></canvas>

    <!-- ملف الأغنية: حط الأغنية بصيغة mp3 جوه فولدر public باسم song.mp3 -->
    <audio id="bg-music" src="./public/song.m4a" preload="auto" loop playsinline></audio>

    <!-- شاشة البداية -->
    <section id="intro-overlay" class="intro-overlay">
      <div class="intro-card">
        <div class="intro-badge">21/6/2026 • 21/11/2026</div>
        <h1 class="intro-title" dir="ltr">I love you Basbosty</h1>
        <p class="intro-subtitle">5 شهور من أحلى صدفة في حياتي يا أحلى بشمهندسة</p>
        <button id="enter-btn" class="enter-btn" type="button">
          <span>دوسي هنا يعمري</span>
          <span class="heart-icon">❤️</span>
        </button>
      </div>
    </section>

    <!-- زرار التحكم في الصوت (تشغيل/كتم) بعد الدخول -->
    <button
      id="music-toggle-btn"
      class="music-toggle-btn hidden"
      type="button"
      aria-label="تشغيل أو إيقاف الأغنية"
      title="تشغيل / إيقاف الأغنية"
    >
      🔊
    </button>

    <!-- أزرار سريعة لفتح الكروت التلاتة في أي وقت -->
    <nav id="quick-cards-bar" class="quick-cards-bar hidden" aria-label="الكروت">
      <button class="pill-btn" data-card="1" type="button">📸 أول صوره تجمعنا سوا</button>
      <button class="pill-btn" data-card="2" type="button">💖 بعشقكك يمراتي</button>
      <button class="pill-btn" data-card="3" type="button">💌 رسالة الـ 5 شهور</button>
    </nav>

    <!-- ستيكرز وقلوب عائمة تفاعلية على الشاشة -->
    <div id="floating-stickers" class="floating-stickers hidden">
      <button class="sticker-btn sticker-1" data-card="1" title="أول صوره تجمعنا سوا" type="button">
        <span>📸</span>
      </button>
      <button class="sticker-btn sticker-2" data-card="2" title="بعشقكك يمراتي" type="button">
        <span>💘</span>
      </button>
      <button class="sticker-btn sticker-3" data-card="3" title="رسالة الـ 5 شهور" type="button">
        <span>💌</span>
      </button>
      <button class="sticker-btn sticker-4" data-card="3" title="ربنا يديمك ليا طول العمر" type="button">
        <span>❤️</span>
      </button>
    </div>

    <!-- الكارت المنبثق (Modal) -->
    <div id="memory-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
      <div class="modal-card">
        <div class="modal-top-heart">❤️</div>

        <div id="modal-image-wrap" class="modal-image-wrap hidden">
          <img
            id="modal-image"
            src="./public/our-first-photo.jpg"
            alt="أول صوره تجمعنا سوا"
            onerror="this.closest('.modal-image-wrap').classList.add('img-missing')"
          />
          <div class="image-fallback">
            الصورة موجودة في <code>public/our-first-photo.jpg</code>
          </div>
        </div>

        <h2 id="modal-title" class="modal-title"></h2>
        <div id="modal-body" class="modal-body"></div>

        <button id="close-modal-btn" class="back-btn" type="button">
          <span>رجوع</span>
          <span>❤️</span>
        </button>
      </div>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
