<style>
    body {
        margin: 0;
        background-color: #000;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    canvas {
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1;
    }

    .text-overlay {
        position: absolute;
        color: #ff1a40;
        font-size: 2.5rem;
        font-weight: bold;
        text-shadow: 0 0 15px #ff1a40, 0 0 30px #ff0033;
        opacity: 0;
        animation: fadeInOut 4s ease-in-out infinite;
        pointer-events: none;
        z-index: 2;
    }

    #playButton {
        position: absolute;
        z-index: 10;
        padding: 12px 30px;
        background: rgba(255, 26, 64, 0.2);
        color: #ff1a40;
        border: 2px solid #ff1a40;
        border-radius: 30px;
        font-size: 1.2rem;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 0 15px rgba(255, 26, 64, 0.5);
        transition: all 0.3s ease;
    }

    #playButton:hover {
        background: #ff1a40;
        color: #fff;
        box-shadow: 0 0 25px #ff1a40;
        transform: scale(1.05);
    }

    @keyframes fadeInOut {
        0%, 100% { opacity: 0; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1); }
    }
</style>

<button id="playButton">اضغط للتشغيل ❤️</button>

<audio id="bgMusic" loop>
    <source src="music/Amr_diab_Awel_Kol_Haga_2017_ _عمرو_دياب_اول_كل_حاجه.m4a">
</audio>

<div class="text-overlay">I LOVE YOU</div>
<canvas id="heartCanvas"></canvas>

<script>
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');
    const playButton = document.getElementById('playButton');
    const bgMusic = document.getElementById('bgMusic');

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
        constructor(targetX, targetY) {
            this.targetX = targetX;
            this.targetY = targetY;
            this.x = canvas.width / 2 + (Math.random() - 0.5) * 200;
            this.y = canvas.height / 2 + (Math.random() - 0.5) * 200;
            this.vx = (Math.random() - 0.5) * 10;
            this.vy = (Math.random() - 0.5) * 10;
            this.color = '#ff1a40';
            this.size = Math.random() * 2 + 1;
            this.friction = 0.92;
            this.springFactor = 0.05;
        }

        update() {
            let dx = this.targetX - this.x;
            let dy = this.targetY - this.y;
            
            this.vx += dx * this.springFactor;
            this.vy += dy * this.springFactor;
            
            this.vx *= this.friction;
            this.vy *= this.friction;

            this.x += this.vx;
            this.y += this.vy;
        }

        draw() {
            ctx.fillStyle = this.color;
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ff0033';
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.closePath();
            ctx.fill();
        }
    }

    let particles = [];
    const particleCount = 1200;

    function initParticles() {
        particles = [];
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2 + 20;
        const scale = Math.min(canvas.width, canvas.height) / 35;

        for (let i = 0; i < particleCount; i++) {
            let t = Math.random() * Math.PI * 2;
            let x = 16 * Math.pow(Math.sin(t), 3);
            let y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));

            let targetX = centerX + x * scale;
            let targetY = centerY + y * scale;

            particles.push(new Particle(targetX, targetY));
        }
    }

    initParticles();

    function animate() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        particles.forEach(p => {
            p.update();
            p.draw();
        });

        requestAnimationFrame(animate);
    }

    animate();

    playButton.addEventListener('click', () => {
        bgMusic.play().then(() => {
            playButton.style.display = 'none';
        }).catch(error => {
            console.log(error);
        });
    });
</script>
